{# Release 720: compact inline action next to Edit Workout; use the established native browser confirmation. #}
<form class="workout720-delete-form"
      id="workout719-delete-{{ delete_workout.id }}"
      method="post" action="/workouts/sessions/{{ delete_workout.id }}/delete"
      onsubmit="return confirm('Delete this entire workout and its recorded sets? This cannot be undone.');">
  <input type="hidden" name="expected_started_at"
         value="{{ delete_workout.started_at.isoformat() }}">
  <input type="hidden" name="confirm_delete" value="yes">
  <input type="hidden" name="reason"
         value="{{ 'Started by mistake' if not delete_workout.completed_at else 'Deleted workout from history' }}">
  <button class="ux675-inline-action workout720-delete-button" type="submit"
          aria-label="Delete workout started {{ delete_workout.started_at|dt }}">Delete</button>
</form>
