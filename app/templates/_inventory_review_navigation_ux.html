<nav id="ir-nav-ux"

      role="status"
      aria-live="polite"
      aria-atomic="true">
</span>

<script>
/* TRACKER_RELEASE_337_344_JS */
(function () {
    "use strict";

    function normalizePath(path) {
        return String(path || "")
            .replace(/\/+$/, "") || "/";
    }

    function findExistingLink(target, exclude) {
        return Array.from(
            document.querySelectorAll("a[href]")
        ).find(function (link) {
            if (exclude.contains(link)) {
                return false;
            }

            try {
                const url = new URL(
                    link.href,
                    window.location.href
                );

                return (
                    url.origin === window.location.origin &&
                    normalizePath(url.pathname) ===
                        normalizePath(target)
                );
            } catch (error) {
                return false;
            }
        });
    }

    function fallbackCopy(text) {
        const field = document.createElement("textarea");

        field.value = text;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";

        document.body.appendChild(field);

        field.focus();
        field.select();

        let copied = false;

        try {
            copied = document.execCommand("copy");
        } finally {
            field.remove();
        }

        return copied;
    }

    async function copyText(text) {
        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {
            await navigator.clipboard.writeText(text);
            return true;
        }

        return fallbackCopy(text);
    }

    function initialize() {
        const nav = document.getElementById("ir-nav-ux");

        if (!nav || nav.dataset.initialized === "1") {
            return;
        }

        nav.dataset.initialized = "1";

        const quality = document.getElementById(
            "ir-nav-quality"
        );

        const planning = document.getElementById(
            "ir-nav-planning"
        );

        const copy = document.getElementById(
            "ir-nav-copy"
        );

        const status = document.getElementById(
            "ir-nav-ux-status"
        );

        if (!quality || !planning || !copy || !status) {
            return;
        }

        // Avoid duplicating navigation links already
        // provided by the shared planning navigation.

        if (
            findExistingLink(
                "/inventory-data-quality",
                nav
            )
        ) {
            quality.hidden = true;
        }

        if (
            findExistingLink(
                "/planning-hub",
                nav
            )
        ) {
            planning.hidden = true;
        }

        // Copy the live URL rather than constructing
        // a new one. This preserves the selected
        // compound, issue filter and other parameters.

        copy.addEventListener(
            "click",
            async function () {
                const url = window.location.href;

                copy.disabled = true;

                try {
                    const copied = await copyText(url);

                    if (copied) {
                        status.textContent = "Link copied.";
                    } else {
                        status.textContent =
                            "Copy unavailable in this browser.";
                    }
                } catch (error) {
                    status.textContent =
                        "Unable to copy link.";
                } finally {
                    copy.disabled = false;
                }
            }
        );

        nav.hidden = false;

        // If existing navigation already provides
        // both destinations, retain only the useful
        // copy-link action in this component.

        const links = document.getElementById(
            "ir-nav-ux-links"
        );

        if (
            links &&
            quality.hidden &&
            planning.hidden
        ) {
            links.hidden = true;
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            { once: true }
        );
    } else {
        initialize();
    }
})();
</script>

<style>

</style>

<script>
/* TRACKER_RELEASE_345_352_JS */
(function () {
    "use strict";

    function normalize(value) {
        return String(value || "")
            .trim()
            .toLowerCase();
    }

    function issueFromSelection(select) {
        if (!select) {
            return null;
        }

        const option = select.options[
            select.selectedIndex
        ];

        if (!option) {
            return null;
        }

        const value = normalize(option.value);
        const label = normalize(option.textContent);

        if (
            value === "expired" ||
            label.includes("expired")
        ) {
            return "expired";
        }

        if (
            value === "undated" ||
            label.includes("undated")
        ) {
            return "undated";
        }

        return "all";
    }

    function initialize() {
        const nav = document.getElementById(
            "ir-nav-ux"
        );

        const actions = document.getElementById(
            "ir-nav-ux-actions"
        );

        const issueSelect = document.getElementById(
            "ir-issue"
        );

        if (!nav || !actions || !issueSelect) {
            return;
        }

        if (nav.dataset.consolidated345 === "1") {
            return;
        }

        nav.dataset.consolidated345 = "1";

        /*
         * Add one small filter indicator to the
         * existing navigation rather than adding
         * another toolbar.
         */

        const indicator = document.createElement(
            "span"
        );

        indicator.id = "ir-nav-active-filter";
        indicator.setAttribute("role", "status");
        indicator.setAttribute("aria-live", "polite");
        indicator.hidden = true;

        actions.insertBefore(
            indicator,
            actions.firstChild
        );

        function refresh() {
            const issue = issueFromSelection(
                issueSelect
            );

            if (issue === "expired") {
                indicator.textContent =
                    "Reviewing: Expired";
                indicator.dataset.issue = "expired";
                indicator.hidden = false;
            } else if (issue === "undated") {
                indicator.textContent =
                    "Reviewing: Undated";
                indicator.dataset.issue = "undated";
                indicator.hidden = false;
            } else {
                indicator.textContent = "";
                indicator.dataset.issue = "all";
                indicator.hidden = true;
            }
        }

        /*
         * Existing issue-filter logic remains
         * responsible for displaying records.
         */

        issueSelect.addEventListener(
            "change",
            refresh
        );

        /*
         * On browser history navigation, allow
         * existing handlers to restore the filter
         * before refreshing the indicator.
         */

        window.addEventListener(
            "popstate",
            function () {
                window.requestAnimationFrame(refresh);
            }
        );

        refresh();
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            { once: true }
        );
    } else {
        initialize();
    }
})();
</script>
