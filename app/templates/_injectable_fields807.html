{% macro injectable_fields(context=none) %}
<details class="tracker-more790"><summary>Injection recording (medication only, optional)</summary>
<label class="field">Recorded route<select name="route807">
{% for value,label in [('', 'Unspecified'),('subcutaneous','Subcutaneous'),('intramuscular','Intramuscular'),('other','Other')] %}
<option value="{{ value }}" {% if context and context.route == value %}selected{% endif %}>{{ label }}</option>
{% endfor %}</select></label>
<label class="field">Recording location<select name="site807" data-site807-field>
<option value="">Not recorded</option>
{% for site in site_codes807 %}<option value="{{ site }}" data-site807="{{ site|site_data807 }}" {% if context and context.site == site %}selected{% endif %}>{{ site|site_label807 }}</option>{% endfor %}
</select></label>
<p class="note">Use only to record a location for an actual injectable medication administration.</p>
</details>
{% endmacro %}
